<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="SN PLUS — Script y panel para VPS: SSH, V2Ray, Xray, Hysteria, SlowDNS, UDP-Custom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="1" stop-color="#0B0F1E"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#B14CFF"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.18" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#B14CFF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#B14CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2540" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity=".55"/>
  <rect width="1280" height="400" fill="url(#glowL)"/>
  <rect width="1280" height="400" fill="url(#glowR)"/>

  <!-- escudo -->
  <g transform="translate(110 92)">
    <path d="M96 0 L188 34 V108 C188 170 148 206 96 228 C44 206 4 170 4 108 V34 Z" fill="url(#neon)" opacity=".35" filter="url(#blur)"/>
    <path d="M96 0 L188 34 V108 C188 170 148 206 96 228 C44 206 4 170 4 108 V34 Z" fill="#0A1020" stroke="url(#neon)" stroke-width="4"/>
    <text x="96" y="132" text-anchor="middle" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#neon)">SN</text>
    <text x="96" y="168" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="18" fill="#7FA3C7" letter-spacing="5">PLUS</text>
  </g>

  <!-- título -->
  <g font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="360" y="168" font-size="96" font-weight="800" fill="url(#neon)" opacity=".5" filter="url(#blur)">SN PLUS</text>
    <text x="360" y="168" font-size="96" font-weight="800" fill="#F2F7FF">SN <tspan fill="url(#neon)">PLUS</tspan></text>
    <text x="364" y="214" font-size="26" fill="#B9C6DA">Script y panel para VPS · todo en un solo menú</text>
  </g>

  <!-- separador de marca -->
  <text x="364" y="256" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="18" fill="#3A4C6E" letter-spacing="2">/ / / / / / / / / / / / / / / / / / / / / / / / /</text>

  <!-- chips -->
  <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="17" font-weight="700">
    <g transform="translate(364 280)">
      <rect width="72" height="34" rx="17" fill="#0E1A2E" stroke="#00E5FF" stroke-opacity=".6"/>
      <text x="36" y="23" text-anchor="middle" fill="#00E5FF">SSH</text>
    </g>
    <g transform="translate(446 280)">
      <rect width="96" height="34" rx="17" fill="#0E1A2E" stroke="#00E5FF" stroke-opacity=".6"/>
      <text x="48" y="23" text-anchor="middle" fill="#00E5FF">V2RAY</text>
    </g>
    <g transform="translate(552 280)">
      <rect width="80" height="34" rx="17" fill="#0E1A2E" stroke="#5FB8FF" stroke-opacity=".6"/>
      <text x="40" y="23" text-anchor="middle" fill="#5FB8FF">XRAY</text>
    </g>
    <g transform="translate(642 280)">
      <rect width="124" height="34" rx="17" fill="#0E1A2E" stroke="#8A8CFF" stroke-opacity=".6"/>
      <text x="62" y="23" text-anchor="middle" fill="#8A8CFF">HYSTERIA</text>
    </g>
    <g transform="translate(776 280)">
      <rect width="112" height="34" rx="17" fill="#0E1A2E" stroke="#A46BFF" stroke-opacity=".6"/>
      <text x="56" y="23" text-anchor="middle" fill="#A46BFF">SLOWDNS</text>
    </g>
    <g transform="translate(898 280)">
      <rect width="136" height="34" rx="17" fill="#0E1A2E" stroke="#B14CFF" stroke-opacity=".6"/>
      <text x="68" y="23" text-anchor="middle" fill="#B14CFF">UDP-CUSTOM</text>
    </g>
    <g transform="translate(1044 280)">
      <rect width="160" height="34" rx="17" fill="#0E1A2E" stroke="#B14CFF" stroke-opacity=".6"/>
      <text x="80" y="23" text-anchor="middle" fill="#C98BFF">+ 18 módulos</text>
    </g>
  </g>

  <text x="364" y="356" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="16" fill="#6B7F9E">Ubuntu 22 · 24 · 26   ·   Debian 11 · 12 · 13   ·   Bots de Telegram y WhatsApp</text>
</svg>
